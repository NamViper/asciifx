name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Tests that otherwise skip: zsh (shell-init snippets run in real zsh, install.sh
      # zsh blocks), tmux (tmux.conf snippet), ffmpeg (video tests). bash/sh are preinstalled.
      - name: Install zsh, tmux, ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh tmux ffmpeg

      - name: Install asciifx
        run: pip install -e '.[dev]'

      - name: Test
        run: pytest -q -rs
